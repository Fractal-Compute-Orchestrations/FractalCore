<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fractal Grid - Login</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">

    <style>
        @font-face {
            font-family: 'Genos';
            src: url("{{ url_for('static', filename='Genos-VariableFont_wght.ttf') }}") format('truetype-variations');
            font-weight: 100 900;
            font-style: normal;
        }

        @font-face {
            font-family: 'Genos';
            src: url("{{ url_for('static', filename='Genos-Italic-VariableFont_wght.ttf') }}") format('truetype-variations');
            font-weight: 100 900;
            font-style: italic;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --scale: 1.5;
            --ink: #0a0a0a;
            --paper: #ffffff;
            --muted: #888;
            --light: #e0e0e0;
            --mono: "Genos", sans-serif;
            --fs-base: calc(var(--scale)*12px);
            --fs-btn: calc(var(--scale)*10px);
        }

        body {
            background: var(--paper);
            color: var(--ink);
            font-family: var(--mono);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            letter-spacing: 0.15em;
            overflow: hidden;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 64px 44px;
            border: 1px solid var(--ink);
            text-align: center;
            animation: fadeIn 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .brand {
            font-size: calc(var(--scale)*20px);
            font-weight: 700;
            letter-spacing: 0.7em;
            text-transform: uppercase;
            margin-bottom: 12px;
            margin-right: -0.7em;
            /* Centers text perfectly despite letter spacing */
        }

        .sub-brand {
            font-size: calc(var(--scale)*9px);
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.45em;
            margin-bottom: 52px;
            margin-right: -0.45em;
        }

        .input-group {
            margin-bottom: 32px;
            text-align: left;
        }

        .label {
            font-size: calc(var(--scale)*8px);
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 12px;
            display: block;
            letter-spacing: 0.3em;
        }

        input[type="password"] {
            width: 100%;
            background: transparent;
            border: 1px solid var(--light);
            padding: 14px;
            font-family: var(--mono);
            font-size: var(--fs-base);
            color: var(--ink);
            outline: none;
            transition: border-color 0.3s, background 0.3s;
            text-align: center;
            letter-spacing: 0.6em;
        }

        input[type="password"]:focus {
            border-color: var(--ink);
            background: #fafafa;
        }

        .login-btn {
            width: 100%;
            background: var(--ink);
            color: var(--paper);
            border: 1px solid var(--ink);
            padding: 16px;
            font-family: var(--mono);
            font-size: var(--fs-btn);
            letter-spacing: 0.45em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .login-btn:hover {
            background: transparent;
            color: var(--ink);
        }

        .error-msg {
            margin-top: 24px;
            font-size: calc(var(--scale)*8.5px);
            color: var(--ink);
            border-top: 1px solid var(--ink);
            padding-top: 16px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }

        /* Subtle decorative line like your dashboard cols */
        .divider {
            height: 1px;
            background: var(--light);
            margin: 0 auto 32px;
            width: 40px;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="brand">FRACTAL</div>
        <div class="sub-brand">Federated Node Auth</div>

        <div class="divider"></div>

        <form action="/login" method="post">
            <div class="input-group">
                <span class="label">System Key</span>
                <input type="password" name="password" required autofocus placeholder="••••••••">
            </div>
            <button type="submit" class="login-btn">Initialize Session</button>
        </form>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}
    </div>
</body>

</html>
